<!-- PWA — Install banner -->
<style>
  #pwa-banner {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999;
    background: #282828; color: #fff;
    padding: 16px 20px calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; align-items: center; gap: 14px;
    font-family: 'Poppins', system-ui, sans-serif;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.18);
    transform: translateY(110%);
    transition: transform 0.35s cubic-bezier(0.34,1.26,0.64,1);
  }
  #pwa-banner.show { transform: translateY(0); }
  #pwa-banner .pwa-icon {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: rgba(255,255,255,0.12);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  #pwa-banner .pwa-text { flex: 1; min-width: 0; }
  #pwa-banner .pwa-text strong { display: block; font-size: 13px; font-weight: 600; }
  #pwa-banner .pwa-text span  { display: block; font-size: 11.5px; opacity: 0.62; margin-top: 2px; line-height: 1.4; }
  #pwa-banner .pwa-btn {
    background: #fff; color: #282828; border: none;
    padding: 10px 16px; border-radius: 10px;
    font-weight: 600; font-size: 13px; cursor: pointer;
    white-space: nowrap; font-family: inherit; flex-shrink: 0;
  }
  #pwa-banner .pwa-x {
    background: none; border: none; color: rgba(255,255,255,0.4);
    font-size: 18px; cursor: pointer; padding: 4px 2px;
    font-family: inherit; flex-shrink: 0; line-height: 1;
  }
</style>

<div id="pwa-banner">
  <div class="pwa-icon">📲</div>
  <div class="pwa-text">
    <strong id="pwa-title">Instalar TermoLab</strong>
    <span  id="pwa-sub">Acesso offline e tela cheia</span>
  </div>
  <button class="pwa-btn" id="pwa-btn">Instalar</button>
  <button class="pwa-x"   id="pwa-x">✕</button>
</div>

<script>
(function () {
  const banner = document.getElementById('pwa-banner');
  const btn    = document.getElementById('pwa-btn');
  const x      = document.getElementById('pwa-x');
  const title  = document.getElementById('pwa-title');
  const sub    = document.getElementById('pwa-sub');
  let deferred = null;

  /* already installed as PWA → hide forever */
  const standalone = window.matchMedia('(display-mode: standalone)').matches
                  || window.navigator.standalone === true;
  if (standalone) return;

  /* dismissed this session */
  if (sessionStorage.getItem('pwa-dismissed')) return;

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

  function show() { setTimeout(() => banner.classList.add('show'), 1800); }

  if (isIOS) {
    title.textContent = 'Instalar no iPhone / iPad';
    sub.textContent   = 'Toque em  ⬆  → "Adicionar à Tela de Início"';
    btn.textContent   = 'Como instalar';
    btn.onclick = () => alert(
      'Para instalar o TermoLab:\n\n' +
      '1. Toque no ícone ⬆ (Compartilhar) na barra do Safari\n' +
      '2. Role para baixo e toque em "Adicionar à Tela de Início"\n' +
      '3. Confirme tocando em "Adicionar"'
    );
    show();
  }

  /* Android / Desktop Chrome */
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    show();
  });

  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    const { outcome } = await deferred.userChoice;
    if (outcome === 'accepted') banner.remove();
    deferred = null;
  });

  x.addEventListener('click', () => {
    banner.classList.remove('show');
    sessionStorage.setItem('pwa-dismissed', '1');
  });

  window.addEventListener('appinstalled', () => banner.remove());
})();
</script>
